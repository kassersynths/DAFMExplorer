[project]
name = "dafm-audio"
version = "0.1.0"
description = "Timbre similarity in FM synthesis: rendering, descriptors and evaluation (YM2612 preset corpus)"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kasser Synths Research" }]

# Pinned on purpose. This package backs a dataset paper, so the dependency set
# is part of the published provenance rather than an implementation detail.
dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.2,<2.3",
    "pyarrow>=16.0,<18.0",
    "scipy>=1.13,<1.15",
    "scikit-learn>=1.5,<1.6",
    "umap-learn>=0.5.6,<0.6",
    "librosa>=0.10.2,<0.11",
    "soundfile>=0.12.1,<0.13",
    "pyloudnorm>=0.1.1,<0.2",
    "soxr>=0.4,<0.6",
    "PyYAML>=6.0,<7.0",
    "click>=8.1,<9.0",
    "tqdm>=4.66,<5.0",
    "matplotlib>=3.8,<4.0",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
# Approximate nearest neighbour backends are OPTIONAL on purpose.
#
# `hnswlib` ships source-only and needs MSVC on Windows, so it cannot be a hard
# dependency of a package that has to install on both machines. At this corpus
# size (~38k items) exact blocked search is entirely affordable and is in fact the
# more defensible default: the plan's own worry is that an approximate index would
# make us measure index error instead of representation quality. So the exact
# backend is the baseline and ANN is an accelerator that must prove its recall.
ann = [
    "hnswlib>=0.8,<0.9",
]
ann-faiss = [
    "faiss-cpu>=1.8,<2.0",
]
# Machine A: RTX 3050 Ti Laptop (Ampere, sm_86). Any recent CUDA wheel works.
machine-a = [
    "torch>=2.4,<3.0",
    "torchaudio>=2.4,<3.0",
]
# Machine B: RTX 5060 Ti (Blackwell, sm_120) REQUIRES CUDA 12.8+ wheels.
# cu121/cu124 wheels do not contain sm_120 kernels and fail at runtime with a
# confusing "no kernel image is available" error. Install with:
#   uv pip install -e ".[machine-b]" --index-url https://download.pytorch.org/whl/cu128
machine-b = [
    "torch>=2.7,<3.0",
    "torchaudio>=2.7,<3.0",
]
embeddings = [
    "panns-inference>=0.1.1",
    "laion-clap>=1.1.6",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<0.13",
]

[project.scripts]
dafm = "dafm_audio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dafm_audio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the full corpus or many renders",
    "needs_audio: needs rendered audio in scratch/",
    "needs_gpu: needs a working CUDA device",
]
